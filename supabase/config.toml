project_id = "jrqrpjdlhzzfanqwinct"

[auth]
site_url = "https://sparkleinsure.app"
additional_redirect_urls = [
  "https://sparkleinsure.app/auth/callback",
  "https://sparkleinsure.app/auth/callback?next=dashboard",
  "https://sparkleinsure.app/auth/callback?next=reset",
  "http://localhost:3000/auth/callback",
  "http://localhost:5173/auth/callback",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "smtp.hostinger.com"
port = 587
user = "noreply@sparkleinsure.app"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "noreply@sparkleinsure.app"
sender_name = "Sparkle Insure"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.rate_limit]
# Custom SMTP supports a higher project-wide allowance than Supabase's
# development mailer. Per-address requests remain limited by max_frequency.
email_sent = 100

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
enabled = false

[functions.storage-cleanup]
verify_jwt = false

[functions.withdrawable-credit-email]
verify_jwt = false
